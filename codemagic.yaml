workflows:
  glovibam-workflow:
    name: GLOVIBAM Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase_ios
    scripts:
      - name: Decode GoogleService-Info.plist for iOS
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > $CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Patch file_picker compileSdk to 36
        script: |
          FILE_PICKER_GRADLE=$(find $HOME/.pub-cache/hosted/pub.dev -maxdepth 1 -iname "file_picker-*" -type d | head -n 1)/android/build.gradle
          if [ -f "$FILE_PICKER_GRADLE" ]; then
            sed -i '' 's/compileSdk [0-9]*/compileSdk 36/' "$FILE_PICKER_GRADLE"
            echo "Patched: $FILE_PICKER_GRADLE"
            cat "$FILE_PICKER_GRADLE" | grep compileSdk
          else
            echo "file_picker build.gradle not found, skipping patch"
          fi

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;

      - name: Set up Android signing
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android/app/glovibam-release-key.jks
          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_BUILD_DIR/android/app/glovibam-release-key.jks
          EOF

      - name: Flutter build Android (AAB)
        script: |
          flutter build appbundle --release

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - glovibam1@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: GLOVIBAM iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "GLOVIBAM Apple Key"
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase_ios
      vars:
        BUNDLE_ID: "com.glovibam.app"
        APP_STORE_APP_ID: 6829446484
    scripts:
      - name: Decode GoogleService-Info.plist for iOS
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > $CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set bundle identifier
        script: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com\.example\.[A-Za-z0-9_-]*;/PRODUCT_BUNDLE_IDENTIFIER = com.glovibam.app;/' ios/Runner.xcodeproj/project.pbxproj
          grep PRODUCT_BUNDLE_IDENTIFIER ios/Runner.xcodeproj/project.pbxproj

      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles

      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID")
          echo "BUILD_NUMBER=$((${LATEST:-0} + 1))" >> $CM_ENV

      - name: Remove alpha from iOS app icons
        script: |
          which magick || brew install imagemagick
          for ICON in ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png; do
            magick "$ICON" -background white -alpha remove -alpha off "$ICON"
            echo "Fixed: $ICON"
          done

      - name: Fix launch screen logo size
        script: |
          if [ -d "ios/Runner/Assets.xcassets/LaunchImage.imageset" ]; then
            cat > ios/Runner/Base.lproj/LaunchScreen.storyboard <<'EOF'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21701" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21679"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <subviews>
                                      <imageView clipsSubviews="YES" userInteractionEnabled="NO" contentMode="scaleAspectFit" horizontalHuggingPriority="251" verticalHuggingPriority="251" image="LaunchImage" translatesAutoresizingMaskIntoConstraints="NO" id="YRO-k0-Ey4">
                                      </imageView>
                                  </subviews>
                                  <viewLayoutGuide key="safeArea" id="Bcu-3y-fUS"/>
                                  <color key="backgroundColor" red="1" green="1" blue="1" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                                  <constraints>
                                      <constraint firstItem="YRO-k0-Ey4" firstAttribute="centerX" secondItem="Ze5-6b-2t3" secondAttribute="centerX" id="1a2-6s-vTC"/>
                                      <constraint firstItem="YRO-k0-Ey4" firstAttribute="centerY" secondItem="Ze5-6b-2t3" secondAttribute="centerY" id="4X2-HB-R7a"/>
                                      <constraint firstAttribute="width" secondItem="YRO-k0-Ey4" constant="160" id="W16-Ls-wd1">
                                      </constraint>
                                      <constraint firstAttribute="height" secondItem="YRO-k0-Ey4" constant="160" id="H16-Ls-ht1">
                                      </constraint>
                                  </constraints>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="53" y="375"/>
                  </scene>
              </scenes>
              <resources>
                  <image name="LaunchImage" width="168" height="185"/>
              </resources>
          </document>
          EOF
            echo "LaunchScreen.storyboard updated"
          else
            echo "LaunchImage.imageset not found, skipping launch screen fix"
          fi

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.1 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - glovibam1@gmail.com
        notify:
          success: true
          failure: true
